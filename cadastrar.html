<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-simples</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div id="Back_cadastro">
        <div id="Cadastro">
            <h1>Cadastro</h1>
            <form id="cadastroForm">

                <!-- DADOS BÁSICOS -->

                <fieldset>
                    <legend>Dados básicos</legend>

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required>
                </fieldset>

                <fieldset>
                    <legend>Identificação</legend>

                    <label for="opcoes">Tipo de cadastro:</label>
                    <select id="opcoes" required>
                        <option value="" selected disabled>Selecione uma opção</option>
                        <option value="cliente">Cliente</option>
                        <option value="vendedor">Vendedor</option>
                    </select>

                    <div id="dadosAdicionais" hidden>
                        <div id="campoCPF" hidden>
                            <label for="cpf">CPF:</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                        </div>

                        <div id="campoCNPJ" hidden>
                            <label for="cnpj">CNPJ:</label>
                            <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
                        </div>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>

                    <label for="estados">Estado (UF):</label>
                    <select id="estados" required>
                        <option value="" selected disabled>Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" required>

                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" required>

                    <label for="rua">Rua / Logradouro:</label>
                    <input type="text" id="rua" required>

                    <label for="numero">Número:</label>
                    <input type="text" id="numero" required>

                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" placeholder="Apartamento, bloco etc.">
                </fieldset>

                <button type="submit">Finalizar cadastro</button>
            </form>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
